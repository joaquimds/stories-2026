services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: stories
      POSTGRES_PASSWORD: stories
      POSTGRES_DB: stories
    ports:
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql

volumes:
  postgres:
